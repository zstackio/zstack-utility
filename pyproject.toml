[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers -m 'not integration and not privileged'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "privileged: explicitly elevated local tests that are excluded from default unit runs",
    "system: system tests",
    "slow: slow running tests",
    "destructive: destructive tests",
    "network: network-dependent tests",
    "storage: storage-dependent tests",
    "disk: disk-dependent tests",
    "vm_lifecycle: VM lifecycle tests",
    "os_ops: OS operations tests",
    "kvmagent: KVM agent tests",
    "zstacklib: zstacklib tests",
    "virtualrouter: virtual router tests",
    "apibinding: API binding tests",
    "sftpbackupstorage: SFTP backup storage tests",
    "ceph: Ceph storage tests",
    "bm_instance: bare metal instance tests",
    "appliancevm: appliance VM tests",
    "consoleproxy: console proxy tests",
    "baremetalpxeserver: bare metal PXE server tests",
]


[tool.coverage.run]
source = ["kvmagent/kvmagent", "virtualrouter/virtualrouter", "consoleproxy/consoleproxy", "sftpbackupstorage/sftpbackupstorage", "cephprimarystorage/cephprimarystorage", "cephbackupstorage/cephbackupstorage", "baremetalpxeserver/baremetalpxeserver"]
omit = [
    "*/kvmagent/test/*",
    "*/kvmagent/test/**/*",
    "*/setup.py",
    "tests/*",
    "zstacklib/*",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "pass",
]
