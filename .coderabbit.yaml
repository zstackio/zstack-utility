  path_instructions:
    - path: '**/*.*'
      instructions: |-
        代码里不应当有有中文，包括报错、注释等都应当使用正确的、无拼写错误的英文来写
    - path: '**/*.py'
      instructions: |-
        ## 1. 语法要求
        应使用 兼容 Python 3.11 的语法，典型例子如下
        - 使用 open 而不是 file 函数
        - 使用 int 而不是 long 类型
        - 不要使用 cmp
        - sorted 不要使用排序函数
        - 不要对 dict 和 dict 进行比较 
        - 不要对 str 和 int 进行比较
        - 不要使用 message 的 exception 字段，使用 str(e) 替代
        - int 直接相除 使用 // 整除符号，而不是 /
        - 使用 [ bool (x) for x in list]] 而不是 filter
        - xml.etree.ElementTree.Element' object has no attribute 'getchildren' 
        - 相对路径 import 要使用 from . import xxx 而不是直接 import xxx ，否则python3 中会报错
        - 注意 bytes 和 str 的区别
        ## 2. 向后兼容原则
        - 之前的代码产生的行为不要直接去改动，即使是 bug 也可能用户有依赖，不应直接改动，可以考虑升级用户一套行为、新安装用户一套行为，开关控制等
        - 有些配置用户可能跳过平台进行了改动，例如虚拟机内的 IP、Hostname、网关等等，平台不应直接覆盖用户可能自定义修改过的东西，这个非常重要
        - 实在需要在覆盖用户的某些配置或者需要改动已有行为，应当对原状态做好记录，做好二次确认，做好回退准备，这个非常重要
        ## 3. 性能规范
        - 避免使用全局sync，推荐使用sync file_path/linux.sync_file(file_path)完成针对单个文件的缓存落盘，防止在IO密集型环境命令无法正常结束
